const T=[
{n:"Recon & OSINT Basics",e:"🔭",
s:"Before a burglar breaks in, they walk around the house. <b>Reconnaissance (recon)</b> is that walk-around: collecting information about a target <i>before</i> testing it. <b>OSINT</b> (Open Source Intelligence) means using only information that is already public: search engines, code sites, job posts. No hacking yet, just reading.",
ex:"A tester has only a company name. In one hour, public pages show that the company runs an AI chatbot, which AI vendor powers it, and who its ML engineers are. Not one company server was touched.",
k:"Recon = map first, test later. OSINT = public information only.",
a:"A detective solves a case using only newspapers, public records and chats with neighbours. They never break into a house. That is OSINT.",
d:"<div class='lb'>🔍 What it really means</div><p>AI recon has four goals: <b>locate</b> AI systems, <b>discover</b> exposed models, <b>gather</b> metadata (versions, frameworks) and <b>detect</b> weak settings.</p><div class='lb'>🧩 The recon funnel (broad → narrow)</div><ul><li><b>1. OSINT:</b> search engines, code sites, job posts</li><li><b>2. Endpoint discovery:</b> find where the AI really lives</li><li><b>3. Enumeration:</b> list what each endpoint accepts</li><li><b>4. Fingerprinting:</b> identify the vendor and framework</li><li><b>5. Mapping:</b> put everything on one picture</li><li><b>6. Assessment:</b> rank what matters most</li></ul><div class='lb'>🧪 Real case</div><div class='ex'>Traditional tests cover servers, web apps and the network. A company can pass all of that while its LLM API, chatbot, vector database and plugins are never tested. AI recon exists to close that gap.</div><div class='lb'>🛠️ How testers use this</div><p><b>Passive</b> recon (reading public information) leaves no trace on the target. <b>Active</b> recon (sending requests to their systems) does, so it needs written permission and a clear scope.</p><div class='k'>🔑 Always work with authorization. Recon is for locking doors, not for walking through them.</div>",
q:[["You only know a company's name. Which action is OSINT?",[["Guessing the admin password","That is an attack, not public information."],["Reading the company's public job posts to see which AI tools they use","Public pages only, with no contact with their systems."],["Flooding their private server with requests","That is active and risky, not OSINT."]],1],
["Which is the correct order of the recon funnel?",[["Assessment → Mapping → OSINT → Fingerprinting","Backwards: you cannot assess what you have not found."],["Mapping → Enumeration → OSINT → Discovery","You must gather before you map."],["OSINT → Endpoint discovery → Enumeration → Fingerprinting → Mapping → Assessment","Each phase feeds the next one."]],2],
["Why do testers start with OSINT before touching any system?",[["It leaves no footprints on the target and carries low risk","Reading public information does not disturb anything."],["It lets them skip getting permission","Permission always matters for active testing."],["It crashes the system faster","Crashing systems is never the goal."]],0]],
r:[["Which list shows the four goals of AI recon?",[["Delete logs, steal data, hide, leave","Those are attacker habits, not recon goals."],["Locate AI systems, find exposed models, gather metadata, detect weak settings","These are the four goals."],["Win contests, post online, sell tools, retire","Not recon goals."]],1],
["When is active probing of an AI endpoint allowed?",[["Whenever the endpoint looks weak","A weak look is never permission."],["Whenever you are curious","Curiosity is not authorization."],["Only with written permission and a defined scope","Authorization and scope make testing legal."]],2]],
x:["A client asks you to map the AI exposure of their company. What is the best way to start?",[["Run aggressive scans on all their servers right away","Active scanning before scope and permission is risky and may be illegal."],["Confirm written scope, then begin with public OSINT before discovery, enumeration and fingerprinting","Permission first, then broad-to-narrow work."],["Find the easiest bug and exploit it","Mapping comes first, and exploitation is not the goal of recon."]],1]},

{n:"Google Dorking & GitHub Recon",e:"🔎",
s:"Search engines index more than companies realise. <b>Dorking</b> means using special search operators (like <code>site:</code> and <code>inurl:</code>) to find exactly the pages you want. Developers also push code to public sites like GitHub, sometimes with <b>secret keys</b> inside. Attackers search for those. Defenders should search first.",
ex:"A search for <code>site:company.com inurl:api</code> shows API documentation pages the company forgot were public. A search for a file called <code>.env</code> on GitHub can reveal a password someone committed by accident.",
k:"If it is public, assume attackers will find it. Search for your own leaks first.",
a:"You write your house-key code on a sticky note, photograph it for a tutorial video and forget to blur it. Anyone watching now has your key. Dorking is the catalog that finds that video.",
d:"<div class='lb'>🔍 What it really means</div><p>Search engines and code hosts store a lot of accidental information. Operators narrow the results to the interesting few.</p><div class='lb'>🧩 Dorks for AI</div><ul><li><code>site:company.com ChatGPT</code> pages that mention ChatGPT</li><li><code>site:company.com \"AI API\"</code> API or integration pages</li><li><code>site:company.com embeddings</code> vector or ML infrastructure</li><li><code>site:company.com inurl:api</code> API endpoints and Swagger docs</li></ul><div class='lb'>🧩 GitHub patterns</div><ul><li><code>filename:.env</code> exposed environment files</li><li><code>OPENAI_API_KEY</code>, <code>AZURE_OPENAI_KEY</code>, <code>PINECONE_API_KEY</code> leaked credentials</li><li><code>LangChain</code> or <code>CrewAI</code> reveals which AI framework is used</li><li>Prompt templates and training scripts reveal how the model behaves</li></ul><div class='lb'>🧪 Real case</div><div class='ex'>A developer committed an OpenAI key to a public repo. Attackers found it by routine scanning, ran up the AI bill, and the company got a huge surprise invoice. No clever hacking was needed.</div><div class='lb'>🛠️ Defence</div><ul><li>Turn on secret scanning and pre-commit checks</li><li>Keep secrets in a vault, never in code</li><li><b>Rotate</b> any leaked key at once, because deleted files stay in git history</li></ul><div class='k'>🔑 A deleted secret is not a safe secret. Revoke it.</div>",
q:[["What does the search <code>site:company.com inurl:api</code> look for?",[["Company logo images","Not what the operators target."],["Exposed API pages and documentation on that site","<code>inurl:api</code> finds API-related addresses."],["Employee birthdays","Nothing here targets personal dates."]],1],
["A developer deletes a file with an API key from GitHub after pushing it. Is the key now safe?",[["Yes, deleted means gone","Git history keeps old versions."],["Only if the repo is small","Size does not matter."],["No. It stays in commit history, so the key must be revoked","Rotate it and check usage logs."]],2],
["You find your own leaked key. What is the first move?",[["Wait and see if anyone notices","Waiting gives attackers time."],["Revoke or rotate it, then check usage logs","Stop the access first, then investigate."],["Rename the file","The key is still valid and still public."]],1]],
r:[["Which GitHub search term helps find leaked environment files?",[["<code>filename:.env</code>","This finds files named .env."],["cat pictures","Unrelated."],["weather today","Unrelated."]],0],
["Why do public prompt templates matter to attackers?",[["They make the site slower","Speed is not the issue."],["They show how the model is told to behave","Hidden rules become visible."],["They do not matter","They reveal behaviour and defences."]],1]],
x:["Your AI bill jumps 50 times overnight, and you find a key in a public repo. Best response?",[["Email the provider and wait","Meanwhile the key keeps working for attackers."],["Delete the repo and hope","History and copies may still exist."],["Revoke the key, review usage logs, then add secret scanning and a vault","Stop, investigate, then prevent."]],2]},

{n:"People & Job-Post Intelligence",e:"🧑‍💼",
s:"Companies share their tech stack without noticing. A <b>job post</b> that says 'must know Pinecone and LangGraph' tells outsiders which tools run inside. A <b>LinkedIn</b> profile says 'built RAG using LangChain'. Piece by piece, public chatter becomes a map of the AI system.",
ex:"A job ad asks for GPT-4, Pinecone and Azure AI. An outsider now guesses the model vendor, the vector database and the cloud platform before sending a single request.",
k:"Public hiring and profile pages are free architecture diagrams.",
a:"A 'Help Wanted' sign says: Locksmith needed, must know Brand-X deadbolts. You now know which lock is on the door without ever touching it.",
d:"<div class='lb'>🔍 What it really means</div><p>Hiring pages and employee profiles are written to attract talent, not to hide details. Required skills reveal the internal stack.</p><div class='lb'>🧩 What leaks</div><ul><li><b>LLMs:</b> Llama, GPT-4, Claude</li><li><b>Orchestration:</b> LangGraph, LangChain</li><li><b>Vector stores:</b> Pinecone, Milvus</li><li><b>Cloud AI:</b> Azure AI</li><li><b>Roles:</b> AI, ML and prompt engineers show who builds what</li></ul><div class='lb'>🧪 Real case</div><div class='ex'>'We built RAG using LangChain' on a profile reveals both the architecture pattern (RAG) and the framework. Two pieces of the attack-surface map, for free.</div><div class='lb'>🛠️ Why it is hard to stop</div><p>This recon uses only what the company chose to publish, so the target cannot detect it. You cannot hide hiring. The right answer is to <b>assume the stack is known</b> and secure every part properly.</p><div class='k'>🔑 Do not rely on secrecy. Rely on strong controls.</div>",
q:[["A job ad says 'experience with Pinecone and LangGraph required'. Which two parts of the system does it reveal?",[["Keyboard and mouse","Not AI components."],["Office Wi-Fi and printers","Not AI components."],["A vector database and an orchestration framework","Pinecone stores vectors, LangGraph orchestrates agents."]],2],
["Why is this recon almost impossible for a company to detect?",[["It breaks the firewall quietly","No firewall is touched."],["It uses only content the company chose to publish","No contact with their systems means nothing to log."],["It is encrypted","Public pages are not encrypted secrets."]],1],
["Which post leaks the most to an attacker?",[["'Happy Friday everyone!'","No technical detail."],["'We built RAG with LangChain on Azure, using Pinecone'","Architecture, framework, cloud and database in one line."],["'Lunch was great'","No technical detail."]],1]],
r:[["Which job titles hint that a company builds AI systems?",[["ML Engineer and Prompt Engineer","These roles build and tune AI systems."],["Receptionist","Not an AI role."],["Cleaner","Not an AI role."]],0],
["What is the best defence against stack leaks?",[["Hide all job posts","Hiring cannot stay secret."],["Assume the stack is known and secure every component","Controls beat secrecy."],["Stop hiring engineers","Not realistic or useful."]],1]],
x:["HR wants to list full tools and versions in every job ad. What is the right security mindset?",[["Ban all job ads","Unrealistic and does not fix the real issue."],["Assume attackers know your stack, and harden each part with auth, least privilege and monitoring","Knowing the stack then gives little advantage."],["Ignore it, because ads are harmless","They are free recon for attackers."]],1]},

{n:"Hugging Face & Model Cards",e:"🤗",
s:"Hugging Face is like a giant public shelf of AI models, datasets and demo apps. Every model has a <b>model card</b>, a manual that says what it learned from, what it is good at and where it fails. Great for honesty, but an attacker can read the same manual.",
ex:"A team uploads a demo app (a <b>Space</b>) for quick testing and forgets it is public. It exposes a live endpoint and a dataset containing real customer text.",
k:"Check what you have published. Transparency should not include secrets.",
a:"A toy has a label and a manual. A parent reads 'breaks if you twist the left arm too hard' to stay safe. Someone else reads it to know exactly where to twist.",
d:"<div class='lb'>🔍 What it really means</div><p>Public AI platforms hold models, datasets, Spaces and model cards. Some are uploaded without proper access controls.</p><div class='lb'>🧩 What model cards reveal</div><ul><li><b>Training data:</b> hints at how it could be poisoned</li><li><b>Limitations:</b> known failure modes</li><li><b>Hyperparameters:</b> help in model inversion attacks</li></ul><div class='lb'>🧩 Other AI hubs</div><p>Papers With Code, Kaggle, ModelScope and Replicate also gather models and code in one place.</p><div class='lb'>🧪 Real case</div><div class='ex'>Production models, datasets with sensitive text and live demo apps have been found public by accident, because default visibility was never checked.</div><div class='lb'>🛠️ Defence</div><ul><li>Use private repos by default</li><li>Review every model card and dataset before release</li><li>Remove internal endpoints and sensitive data</li></ul><div class='k'>🔑 Publish useful facts, never secrets.</div>",
q:[["What is a model card?",[["A password for the model","It is not a credential."],["A document describing a model's training, use and limits","It is the model's manual."],["A payment card","Unrelated."]],1],
["Why can a 'Limitations' section help an attacker?",[["It shows where the model is known to fail","Known failure modes are good places to probe."],["It deletes the model","Text cannot delete a model."],["It speeds up the model","It does not change speed."]],0],
["A team publishes a dataset containing real customer chats. What is the problem?",[["Nothing, datasets are boring","Sensitive data is a prize."],["The files are too large","Size is not the security issue."],["Sensitive data is exposed to the public","Anyone can download and read it."]],2]],
r:[["Which Hugging Face item is a live demo app?",[["Space","Spaces host live demos."],["Cache","Not a demo app."],["Pillow","Not a demo app."]],0],
["What is a good habit before publishing a model or dataset?",[["Set visibility, then review for sensitive data and endpoints","Check before the world can see it."],["Publish first, review later","Too late once copied."],["Skip the model card","Cards are useful when they contain no secrets."]],0]],
x:["Your team wants transparent model cards but fears attackers will read them. What is the best balance?",[["Publish nothing at all","Loses the benefits of transparency."],["Publish everything, including internal endpoints","This helps attackers."],["Share intended use and limits, but remove secrets, internal endpoints and sensitive data sources, and review before release","Useful and safe."]],2]},

{n:"Shodan, Censys & DNS",e:"📡",
s:"Google searches web pages. <b>Shodan</b> and <b>Censys</b> search <i>machines</i> connected to the internet and record what each one says about itself. AI servers such as Ollama, vLLM, Jupyter and FastAPI can show up, sometimes with no password. <b>DNS enumeration</b> finds hidden names like chat.company.com or rag.company.com.",
ex:"Someone starts a test AI server on a cloud machine for a weekend project and forgets the firewall rule. A scanner indexes it. Now anyone can use that model for free.",
k:"If it is connected to the internet, scanners have probably already seen it.",
a:"Google is a map of places. Shodan is a directory of every unlocked door in a city, searchable by lock brand.",
d:"<div class='lb'>🔍 What it really means</div><p>Internet scanners keep a catalogue of exposed services. Defenders can use the same catalogues to find their own mistakes.</p><div class='lb'>🧩 Shodan searches for AI</div><ul><li><b>OpenAI</b> proxy and API endpoints</li><li><b>Ollama</b> local LLM servers</li><li><b>vLLM</b> inference servers</li><li><b>TensorFlow</b> serving instances</li><li><b>Jupyter</b> notebooks (often full code execution)</li><li><b>FastAPI</b> Python API servers</li></ul><div class='lb'>🧩 Censys and DNS</div><ul><li><b>Censys:</b> TLS certificates and public endpoints at internet scale</li><li><b>Tools:</b> dig, nslookup, amass, subfinder</li><li><b>Guessable names:</b> chat, gpt, llm, vector, rag, api-ai, assistant</li><li>Public certificate logs can reveal subdomains never linked anywhere</li></ul><div class='lb'>🛠️ Defence</div><ul><li>Keep an asset inventory and search for your own assets</li><li>Require authentication and close unused ports</li><li>Put test servers behind a firewall or VPN</li></ul><div class='k'>🔑 Unlisted does not mean unfindable.</div>",
q:[["What does Shodan mainly search?",[["Only social media posts","Not its job."],["Internet-connected devices and services","It indexes what servers reveal."],["Only images","Not its job."]],1],
["Why is an exposed Jupyter notebook worse than an exposed static web page?",[["It is larger","Size is not the risk."],["It can allow code to run on the server","Notebooks execute code, so access means power."],["It loads slower","Speed is not the risk."]],1],
["Why do teams discover subdomains like rag.company.com so easily?",[["Names follow predictable patterns and certificates are logged publicly","Guessable names plus public certificate logs."],["Subdomains are always listed on the homepage","Often they are not."],["It is pure luck","It is systematic."]],0]],
r:[["Which tool helps find subdomains?",[["Notepad","Not a recon tool."],["subfinder","A subdomain discovery tool."],["Paint","Not a recon tool."]],1],
["What is the best defence against accidental exposure?",[["Hope nobody scans","Scanners run all the time."],["Rename the server","Names do not hide services."],["Keep an inventory, search your own assets, require authentication and close ports","You find and fix before others do."]],2]],
x:["You find an unauthenticated inference server in your cloud account. What is the right priority?",[["Ignore it, because it is only for testing","Test servers get abused too."],["Block network access or add authentication now, check logs for misuse, then add it to inventory and monitoring","Contain, investigate, prevent."],["Delete the logs","Evidence matters."]],1]},

{n:"API Discovery & Fingerprinting",e:"🔌",
s:"An <b>API</b> is the door programs use to talk to the AI. Recon asks four things in order: What kinds of doors exist (REST, GraphQL, inference, streaming)? What does each door accept (methods, headers, parameters, limits)? What do AI-specific settings do (temperature, system, tools)? Which vendor or framework built it (<b>fingerprinting</b>)?",
ex:"An AI endpoint returns an oddly formatted error. A tester recognises it as typical of one framework and then looks up that framework's public known issues.",
k:"Discover → enumerate → understand parameters → fingerprint.",
a:"You find a locked box (discovery), list what is written on each side (enumeration), read the labels (parameters) and recognise the brand stamped on it (fingerprinting).",
d:"<div class='lb'>🔍 What it really means</div><p>Each step narrows the picture of what is running behind the door.</p><div class='lb'>🧩 API types</div><ul><li><b>REST:</b> standard HTTP endpoints</li><li><b>GraphQL:</b> introspection can reveal the whole schema</li><li><b>Inference APIs:</b> direct text, image or audio generation</li><li><b>Streaming / WebSockets:</b> real-time token streams</li></ul><div class='lb'>🧩 Enumeration and AI parameters</div><ul><li><b>Methods, headers, tokens, rate limits</b> show how access control really works</li><li><b>temperature / top_p:</b> randomness of answers</li><li><b>model / system:</b> which model and hidden rules</li><li><b>messages / stream:</b> how context is built</li><li><b>tools / functions:</b> what the model may <i>do</i>, a prime target for indirect prompt injection</li><li><b>seed:</b> repeatable tests</li></ul><div class='lb'>🧩 Fingerprinting</div><p>Vendors (OpenAI, Anthropic, Azure AI, Ollama) and frameworks (LangChain, LlamaIndex, CrewAI, Haystack, Semantic Kernel, AutoGen) leave patterns in headers, errors and structure.</p><div class='lb'>🛠️ Defence</div><ul><li>Authentication and rate limits on every endpoint</li><li>Generic error messages and no introspection in production</li></ul><div class='k'>🔑 Every detail an API gives away helps the next step.</div>",
q:[["Which AI API parameter defines what actions the model may take?",[["temperature","It controls randomness, not actions."],["seed","It controls repeatability."],["tools / functions","These list the callable actions."]],2],
["A GraphQL endpoint has introspection turned on in production. What is the risk?",[["It reveals the full schema, including fields not meant to be public","Introspection maps the whole data model."],["It makes the API faster","It does not change speed."],["No risk at all","It exposes structure."]],0],
["Why do detailed error messages help attackers?",[["They make the page prettier","Not relevant."],["They slow the server","Not relevant."],["They reveal the vendor or framework behind the API","That helps fingerprinting."]],2]],
r:[["Why is the <code>seed</code> parameter useful to a tester?",[["Same input gives repeatable output, so tests are comparable","Repeatability helps testing."],["It hides the model","It does not hide anything."],["It deletes logs","Unrelated."]],0],
["Which set of controls reduces API recon value?",[["Verbose errors and open access","This helps attackers."],["Authentication, rate limiting and generic errors","Less leaked detail, less abuse."],["More headers with version numbers","Version numbers help fingerprinting."]],1]],
x:["Your AI API returns verbose framework errors and has no rate limit. Which fix set is best?",[["Add a nicer logo","Cosmetic only."],["Generic errors, rate limits, authentication and introspection off in production","Covers leakage, abuse and access."],["Increase the temperature","Unrelated to security."]],1]},

{n:"AI Agents Recon",e:"🤖",
s:"An <b>agent</b> is an AI that can <i>act</i>: call tools, remember things and follow workflows. Recon of an agent means listing four things: its <b>endpoints</b>, its <b>tools</b>, its <b>memory</b> and its <b>decision paths</b>. A chatbot only talks. An agent can also do.",
ex:"A support agent can look up orders and issue refunds. A tester lists its tools and finds the refund tool has no cap and never checks that the order belongs to the person asking.",
k:"Map what an agent can DO, not just what it can say.",
a:"A receptionist behind glass can only talk. An agent is a receptionist who also holds master keys. You study the keycard list, not just the desk.",
d:"<div class='lb'>🔍 What it really means</div><p>Every tool, memory store and decision path of an agent is a possible way to cause real actions.</p><div class='lb'>🧩 What to enumerate</div><ul><li><b>Endpoints:</b> where tasks are submitted and results fetched</li><li><b>Tools and plugins:</b> code execution, search, database access</li><li><b>Memory:</b> short and long term, which may leak across users or be poisoned</li><li><b>Workflow logic:</b> decision paths that show where it could be pushed too far</li></ul><div class='lb'>🧪 Example</div><div class='ex'>An email agent reads the inbox and can send mail. Anyone can email you, so anyone can feed it text. Reading untrusted input plus sending power is the dangerous mix.</div><div class='lb'>🛠️ Defence</div><ul><li>Least privilege: small tools, read-only by default</li><li>Human approval for sending, deleting and paying</li><li>Per-user checks and full logging of tool calls</li></ul><div class='k'>🔑 The bigger the agent's power, the bigger the blast radius.</div>",
q:[["Which activity is part of agent recon?",[["Listing its tools and the permissions each tool has","Tools and permissions define what it can do."],["Counting its keyboard keys","Not relevant."],["Repainting the logo","Not relevant."]],0],
["Why is agent memory a target?",[["It can make the screen brighter","Not relevant."],["It may leak context across users or be poisoned to affect later sessions","Memory persists, so poison persists."],["It is only a cache for fonts","Not what agent memory is."]],1],
["A refund tool has no cap. What is the risk?",[["It will print slower","Not relevant."],["Nothing, refunds are fine","Unlimited refunds mean unlimited loss."],["A tricked agent could issue unlimited refunds","Missing limits turn tricks into real loss."]],2]],
r:[["What is the difference between a chatbot and an agent?",[["An agent can take actions through tools","That is the key difference."],["An agent has a bigger screen","Not relevant."],["A chatbot is always safe","Not true."]],0],
["Which is the best first control for an agent?",[["Give it admin rights","Opposite of least privilege."],["Least privilege plus approval for high-impact actions","Limits damage if it is fooled."],["Hide its name","Hiding names does not limit power."]],1]],
x:["An email agent has read-inbox and send-mail tools. What is the main risk and the best fix?",[["Untrusted emails can steer it to send data out, so require approval for sending and limit what it can read or send","Untrusted input plus send power is the risky mix."],["Nothing, mail is normal","Mail is untrusted input."],["Use a longer password","Does not address agent steering."]],0]},

{n:"Vector Databases & RAG",e:"🗃️",
s:"A <b>vector database</b> stores meaning as numbers (<b>embeddings</b>) so AI can look up related text. <b>RAG</b> means the AI first retrieves documents from this database, then answers using them. Each step is a door: user input, LLM, retriever, vector DB and knowledge base.",
ex:"A company deploys a vector database full of internal documents, but without a password. Anyone on the internet can query it and read the knowledge, and no classic alarm goes off.",
k:"Whatever the AI can retrieve, an attacker may retrieve too. Check access at the database.",
a:"A librarian understands meaning: ask for a sad dog story and she hands you a book even if the title lacks those words. The risk is whether she checks who is asking.",
d:"<div class='lb'>🔍 What it really means</div><p>Vector stores hold the AI's knowledge. If they are open or shared without per-user checks, that knowledge leaks.</p><div class='lb'>🧩 Platforms</div><p>Pinecone (managed), Milvus and Qdrant (open source), Weaviate and Chroma (developer friendly), FAISS (in-memory library).</p><div class='lb'>🧩 What testers enumerate</div><ul><li>The <b>embedding model</b> in use</li><li><b>Collections and namespaces</b> that may separate sensitive data</li><li><b>Metadata</b> such as sources, timestamps and access tags</li><li><b>Access controls and indexes</b>, including RBAC mistakes</li></ul><div class='lb'>🧩 Risk in each RAG layer</div><ul><li><b>User input:</b> prompt injection</li><li><b>LLM:</b> manipulation, jailbreaking</li><li><b>Retriever:</b> query rewriting, retrieval poisoning</li><li><b>Vector DB:</b> embedding injection, data exfiltration</li><li><b>Knowledge base:</b> tampered source documents</li></ul><div class='lb'>🛠️ Defence</div><ul><li>Authentication and network isolation</li><li>Per-user or per-tenant filtering at query time</li><li>Validate and track the source of every document</li></ul><div class='k'>🔑 Poison at the bottom of the pipeline flows up to every user.</div>",
q:[["What does a vector database store?",[["Embeddings (meaning as numbers)","That is what it stores for semantic search."],["Only passwords","Not its purpose."],["Only images of cats","Not its purpose."]],0],
["Which is the correct RAG order from user to data source?",[["Knowledge base → Retriever → User","Backwards."],["LLM → User → Vector DB","Mixed up."],["User input → LLM → Retriever → Vector DB → Knowledge base","The flow used in this module."]],2],
["A shared vector index has no per-user filtering. What is the risk?",[["Users may retrieve other users' documents","Nearest matches can come from anyone's data."],["The index gets smaller","Not relevant."],["Nothing, all users are equal","They are not equal for data access."]],0]],
r:[["What is retrieval poisoning?",[["Cleaning the database","The opposite."],["Planting bad content in the knowledge base so it is retrieved later","Poison reaches users through retrieval."],["Deleting the index","That is destruction, not poisoning."]],1],
["Which control helps most with cross-user leaks?",[["A bigger model","Does not fix access."],["A longer prompt","Does not fix access."],["Authentication plus per-tenant filtering at query time","Access is enforced where the data lives."]],2]],
x:["A user sees another customer's data in an AI answer. What is the likely cause and fix?",[["Retrieval ignores who is asking, so add per-user filters at query time and test with several tenants","Access control must apply at retrieval."],["The model is too small","Size is not the cause."],["The screen is too bright","Not relevant."]],0]},

{n:"Training Pipelines, Cloud AI & Secrets",e:"🏗️",
s:"Before an AI is used, it is built in a <b>training pipeline</b>: code repos, CI/CD, storage buckets and experiment trackers (MLflow, Weights &amp; Biases). These often leak models, datasets and keys because they are built fast. Cloud AI platforms (Azure OpenAI, AWS Bedrock, Vertex AI, SageMaker) each have their own security settings. <b>Secrets</b> such as API keys, tokens and .env files are the prize.",
ex:"A storage bucket holding model checkpoints is set to public, and an experiment tracker shows model versions and hyperparameters to anyone with the link.",
k:"The AI's build site is part of the attack surface. Never hardcode secrets.",
a:"A bakery writes its secret recipe on a whiteboard, photographs the whiteboard for Instagram and forgets the recipe is in the background.",
d:"<div class='lb'>🔍 What it really means</div><p>Training is a messy, fast, experimental process, so security is often skipped. Leaks here reveal data, models and credentials.</p><div class='lb'>🧩 Where it leaks</div><ul><li><b>GitHub / GitLab:</b> keys, configs, training scripts</li><li><b>CI/CD:</b> build artifacts and environment secrets</li><li><b>S3 / Azure Storage:</b> public buckets with datasets, weights and checkpoints</li><li><b>MLflow / Weights &amp; Biases:</b> versions, hyperparameters, metrics</li></ul><div class='lb'>🧩 Cloud AI platforms</div><ul><li><b>Azure OpenAI:</b> RBAC and private endpoints</li><li><b>AWS Bedrock:</b> access through IAM</li><li><b>Vertex AI:</b> governance features</li><li><b>SageMaker:</b> notebook and endpoint exposure risks</li><li><b>OpenAI API:</b> key management is critical</li></ul><div class='lb'>🧩 Secret hiding places</div><p>Source code and commit history, <code>.env</code> files, container images, Dockerfiles and Kubernetes manifests or ConfigMaps.</p><div class='lb'>🛠️ Defence</div><ul><li>Secrets vault with rotation and short-lived credentials</li><li>Private buckets and least-privilege roles</li><li>Dataset source tracking, since data origin shows poisoning risk</li></ul><div class='k'>🔑 If a secret was ever in code, treat it as burned.</div>",
q:[["Which is a common leak source in training pipelines?",[["Misconfigured storage buckets","They can expose datasets, weights and checkpoints."],["A fast keyboard","Not relevant."],["Monitor brightness","Not relevant."]],0],
["Where do secrets often hide?",[["Only in the user's head","They are written in many places."],["Code, commit history, .env files and Docker or Kubernetes configs","These are the usual places."],["Only on paper","Not typical."]],1],
["Why are experiment trackers a recon target?",[["They print money","Not relevant."],["They run the website","Not their role."],["They can leak model versions, hyperparameters and metrics","That is useful intelligence."]],2]],
r:[["Where should secrets be stored?",[["In a secrets vault with rotation","Central, controlled and renewable."],["In the README","Public and permanent."],["In a chat group","Insecure and shareable."]],0],
["Why is knowing the cloud platform useful in recon?",[["It changes the weather","Not relevant."],["It shows which settings and services to check","Each platform has its own security settings."],["It speeds up the model","Not relevant."]],1]],
x:["A notebook spun up for a quick test holds live credentials and keeps running for months. Which process fix is best?",[["Short-lived credentials, a vault, auto-shutdown, and scanning plus inventory of environments","Fixes the root cause: forgotten, long-lived secrets."],["Ask the team to remember","People forget under deadlines."],["Rename the notebook","Does nothing for security."]],0]},

{n:"Exposure Assessment & Hardening",e:"🧱",
s:"After mapping, ask five fast questions: Is the API <b>public</b>? Is <b>authentication</b> on? Is <b>rate limiting</b> on? Is <b>logging</b> safe? Is there <b>prompt filtering</b>? Then rank problems by <b>how easy to exploit × how bad if exploited</b>. Fix 'public and no authentication' first. Then apply the baseline: authentication, authorization, encryption, rate limiting and secrets management.",
ex:"Two findings: a public model endpoint with no authentication, and an internal admin page with a small theoretical flaw. The public endpoint is fixed first.",
k:"Fix what enables direct compromise first.",
a:"A doctor in an emergency room treats the bleeding patient before the one with a sore toe. That is triage, and risk ranking works the same way.",
d:"<div class='lb'>🔍 What it really means</div><p>You cannot fix everything at once. Exposure assessment and risk ranking tell you what to do first.</p><div class='lb'>🧩 The five-question checklist</div><ul><li><b>Public API?</b> Open endpoints are immediately exploitable</li><li><b>Authentication?</b> Weak or missing means full access</li><li><b>Rate limiting?</b> Missing limits allow brute force and enumeration</li><li><b>Logging?</b> Verbose logs can leak prompts and outputs</li><li><b>Prompt filtering?</b> Missing checks enable injection</li></ul><div class='lb'>🧩 Attack surface inventory</div><ul><li><b>AI models:</b> LLMs, classifiers, generative models</li><li><b>APIs and agents:</b> entry points and tool use</li><li><b>Vector DBs:</b> sensitive embeddings</li><li><b>Storage and plugins:</b> weights, datasets, integrations</li></ul><div class='lb'>🛠️ Hardening baseline</div><ul><li>Authentication and authorization (least privilege)</li><li>Encryption in transit and at rest</li><li>Rate limiting</li><li>Secrets management with vaults and rotation</li></ul><div class='k'>🔑 Security controls should be on by default, not added after a breach.</div>",
q:[["Which is the highest-risk configuration?",[["A public-facing model with no authentication","Anyone can use it right now."],["An internal tool with a typo","Low risk."],["A private model behind strong auth","This is the safe setup."]],0],
["Which is NOT part of the hardening baseline?",[["Authentication","This is part of the baseline."],["Rate limiting","This is part of the baseline."],["Posting API keys in a README","This is a leak, not a control."]],2],
["Why can verbose logs be a concern?",[["They may contain prompts, inputs or outputs with sensitive data","Logs can become a data leak."],["They make the model dumber","Not relevant."],["They speed up attacks on Wi-Fi","Not relevant."]],0]],
r:[["How is risk ranked in this module?",[["By alphabetical order","Not a risk method."],["By how easy it is to exploit and how bad the impact is","Exploitability × impact."],["By the colour of the dashboard","Not a risk method."]],1],
["Why use rate limiting?",[["To stop abuse, enumeration and runaway costs","It caps how fast anyone can hit the system."],["To make answers longer","Not its purpose."],["To hide the model name","Not its purpose."]],0]],
x:["Three findings: (A) public API with no auth, (B) missing rate limit on an internal tool, (C) outdated help page. What order do you fix them?",[["C, B, A","Backwards: the worst is last."],["B, C, A","The worst is still last."],["A, B, C","Direct compromise first, then abuse risk, then low impact."]],2]},

{n:"Threat Intel, Monitoring & Real Cases",e:"📈",
s:"AI changes fast, with new endpoints and models appearing weekly. Defenders follow <b>MITRE ATLAS</b> (attack techniques against AI), the <b>OWASP LLM Top 10</b> (top risks) and CVE advisories. They also run a loop: detect new endpoints → scan API changes → watch for prompt leaks → alert and fix → repeat.",
ex:"Samsung staff pasted confidential code into a public chatbot. Nobody hacked anything. The problem was a missing AI-use policy.",
k:"Security is a loop, not a one-time check.",
a:"Every night, someone walks around the house to see what changed, because houses (and AI systems) keep changing.",
d:"<div class='lb'>🔍 What it really means</div><p>Threat intelligence tells you what attackers do. Continuous monitoring tells you when your own system changed.</p><div class='lb'>🧩 Sources to follow</div><ul><li><b>MITRE ATLAS:</b> adversary techniques for AI systems</li><li><b>OWASP LLM Top 10:</b> the most critical LLM risks</li><li><b>CVEs and vendor advisories:</b> flaws in AI frameworks and cloud services</li></ul><div class='lb'>🧪 Three real cases</div><ul><li><b>Samsung and ChatGPT:</b> code pasted into a public AI. Lesson: governance and usage policy</li><li><b>Public GitHub key leak:</b> found by scanning, abused at scale. Lesson: secrets management</li><li><b>Exposed vector database:</b> no authentication, data queried directly and quietly. Lesson: protect AI components like any database</li></ul><div class='lb'>🛠️ Monitoring cycle</div><p>Detect new endpoints → scan API changes → monitor prompt leaks → alert and remediate → repeat.</p><div class='k'>🔑 Not every breach needs hacking. Some need only a missing policy or a missing password.</div>",
q:[["What is MITRE ATLAS?",[["A video game","Not related."],["A map of cloud regions","Not related."],["A knowledge base of adversary techniques against AI systems","This is its purpose."]],2],
["What was the main cause in the Samsung and ChatGPT case?",[["A missing AI-use policy and governance","Staff used a public AI with no clear rules."],["A hardware fault","Not the cause."],["A zero-day exploit","No exploit was needed."]],0],
["Why is continuous monitoring needed for AI systems?",[["Because screens fade","Not relevant."],["Because new endpoints and models keep appearing","One-time checks go stale fast."],["Because logs are shiny","Not relevant."]],1]],
r:[["What is the OWASP LLM Top 10?",[["A list of the most critical LLM security risks","This is its purpose."],["A list of the ten best chatbots","Not its purpose."],["A pricing table","Not its purpose."]],0],
["Why did the exposed vector database breach go unnoticed by classic alerts?",[["The attacker used a screwdriver","Not relevant."],["The server was off","It was running."],["There was no authentication, so the queries looked like normal usage","Nothing looked like a classic attack."]],2]],
x:["Design a monthly routine for your AI product. Which is best?",[["Wait for an incident report","Reactive, not continuous."],["Inventory new endpoints, scan API changes, review logs for prompt leaks, check advisories, then fix and repeat","Matches the monitoring loop."],["Update the logo","Cosmetic."]],1]}
];
const $=document.getElementById('app');
const CH=["Nice work! 🎯","Spot on! 🔥","You're getting this! 💪","Sharp thinking! ⚡"],OP=["Good try — now you know the trick! 🌱","Mistakes teach best. Read why below 👇","Learning in action — no worries! 💡"];
let ti=0,set=[],qi=0,ok=0,kind='',tries=0,res=[],xp=0,sk=0,ans=false;
const R=a=>a[Math.floor(Math.random()*a.length)];
function hud(){document.getElementById('xp').textContent='⭐ '+xp+' XP';document.getElementById('sk').textContent='🔥 '+sk;
const done=res.filter(Boolean).length,p=Math.round(done/T.length*100);document.getElementById('pb').style.width=p+'%';
document.getElementById('pt').textContent=ti>=T.length?'All topics complete — amazing! 🎓':`Topic ${ti+1} of ${T.length} · ${p}% complete`+(done?` · ${done} mastered 💪`:' · You can do this!')}
function learn(){hud();const t=T[ti];$.innerHTML=`<div class="c"><span class="tag">Topic ${ti+1} of ${T.length}</span><h2>${t.e} ${t.n}</h2>
<div class="lb">💡 The idea in simple words</div><p>${t.s}</p><div class="lb">📌 Real example</div><div class="ex">${t.ex}</div><div class="k">🔑 ${t.k}</div>
<p class="m">Next: a few short scenarios. Wrong answers are fine — each one comes with a clear explanation!</p><button class="p" onclick="start('check')">I'm ready →</button></div>`}
function start(k){kind=k;set=k=='deep'?[T[ti].x]:(k=='retry'&&tries%2==1?T[ti].r:k=='retry'?T[ti].q:T[ti].q);qi=0;ok=0;ask()}
function ask(){hud();ans=false;const q=set[qi],t=T[ti],lab=kind=='deep'?'🏆 Challenge':kind=='retry'?'🌱 Try again':'Scenario';
$.innerHTML=`<div class="c"><span class="tag">${t.e} ${t.n} · ${lab} ${qi+1}/${set.length}</span><p class="q">${q[0]}</p><div id="o">${q[1].map((o,i)=>`<button class="b" onclick="pick(${i})"><span class="L">${'ABC'[i]}</span>${o[0]}</button>`).join('')}</div><div id="f"></div></div>`}
function pick(i){if(ans)return;ans=true;const q=set[qi],bs=document.querySelectorAll('#o .b'),good=i==q[2];
bs.forEach((b,j)=>{b.disabled=true;const w=document.createElement('span');w.className='w2';
if(j==q[2]){b.classList.add('ok');w.textContent='✅ Why this is right: '+q[1][j][1]}else{if(j==i)b.classList.add('no');w.textContent=(j==i?'❌ Why this is wrong: ':'✖ Why not this: ')+q[1][j][1]}b.appendChild(w)});
if(good){ok++;sk++;xp+=10}else sk=0;hud();
document.getElementById('f').innerHTML=`<div class="msg">${good?R(CH)+(sk>=3?` ${sk} in a row! 🔥`:' +10 XP'):R(OP)}</div><button class="p" onclick="nxt()">${qi+1<set.length?'Next →':'See result →'}</button>`}
function nxt(){qi++;qi<set.length?ask():result()}
function result(){const t=T[ti],n=set.length,all=n==1?ok==1:ok>=(n==3?2:n);
if(kind=='deep'){if(all)xp+=20;return endTopic(all)}
if(all){res[ti]=res[ti]||(kind=='check'?'first':'review');hud();
$.innerHTML=`<div class="c"><span class="tag">Result: ${ok}/${n}</span><h2>🎉 You've understood it!</h2><p>${kind=='check'?"You got it on the first try — that's real confidence.":"The simpler story worked — you turned confusion into understanding. That's how experts learn!"}</p><p class="m">Ready for the more detailed version?</p><button class="p" onclick="deep()">Go deeper →</button></div>`;return}
tries++;
$.innerHTML=`<div class="c"><span class="tag">Result: ${ok}/${n}</span><h2>Let's make it even simpler 🌱</h2><p>This is a tricky idea — you're doing fine. Here it is as an everyday story:</p><div class="ex">${t.a}</div><div class="k">🔑 ${t.k}</div><button class="p" onclick="start('retry')">Test me again →</button><button class="p g" onclick="res[ti]='revisit';deep()">Skip &amp; revisit later</button></div>`}
function deep(){hud();const t=T[ti];$.innerHTML=`<div class="c"><span class="tag">Level 2 · Going deeper</span><h2>${t.e} ${t.n}: the details</h2><p>${t.d}</p><p class="m">Now put it to work in one realistic challenge.</p><button class="p" onclick="start('deep')">Challenge question →</button></div>`}
function endTopic(all){hud();const last=ti==T.length-1,left=T.length-ti-1;
$.innerHTML=`<div class="c"><h2>${all?'🏆 Topic mastered!':'📌 Good effort!'}</h2><p>${all?'You used the idea in a harder, realistic scenario. +20 XP bonus!':'Re-read the deep dive above later — each attempt makes you stronger.'}</p><p class="m">${left?`${left} topic${left>1?'s':''} to go — you're building real skill!`:"That's the last topic — finish strong!"}</p><button class="p" onclick="go()">${last?'See my results →':'Next topic →'}</button></div>`}
function go(){ti++;ti<T.length?learn():fin()}
function fin(){ti=T.length;hud();const L={first:'✅ Got it first try',review:'🌱 Mastered after a simpler explanation',revisit:'📌 Worth a quick revisit'};
const m=res.filter(r=>r!='revisit').length,badge=m==T.length?'🥇 AI Recon Pro':m>=T.length-1?'🥈 Rising Security Pro':'🥉 Curious Explorer';
$.innerHTML=`<div class="c"><h2>🎓 Module complete!</h2><p><b>${badge}</b> · ⭐ ${xp} XP</p><p>You mapped AI systems the way a professional ethical tester does, so doors can be locked before attackers arrive. Remember: only test systems you own or have written permission to test. Be proud of this skill!</p>${T.map((t,i)=>`<p>${t.e} <b>${t.n}</b><br><span class="m">${L[res[i]]||L.revisit}</span></p>`).join('')}<button class="p" onclick="ti=0;res=[];tries=0;xp=0;sk=0;learn()">Restart</button></div>`}
learn();
</script></body></html>
